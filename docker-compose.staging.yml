version: '3.8'

services:
  staging-app:
    image: baseos:staging-latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baseos-staging-app
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://seu-projeto-staging.supabase.co}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-sua-anon-key-staging}
      - VITE_EMPTY_DATABASE=false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - baseos-staging-net

networks:
  baseos-staging-net:
    name: baseos-staging-net
    driver: bridge
