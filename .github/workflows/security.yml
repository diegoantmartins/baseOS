name: BaseOS Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Executa semanalmente toda segunda-feira às 04:00 UTC

jobs:
  security-audit:
    name: Dependency & Code Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run npm Audit
        run: npm audit --audit-level=high
