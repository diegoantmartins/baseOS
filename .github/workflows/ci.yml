name: BaseOS CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-and-tests:
    name: Code Quality & Automated Tests
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: ESLint Check
        run: npm run lint

      - name: Run Vitest Test Suite (Unit & Integration)
        run: npm test

      - name: Production Bundle Build
        run: npm run build
