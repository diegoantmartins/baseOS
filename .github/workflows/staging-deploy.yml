name: BaseOS Staging Deploy Pipeline

on:
  push:
    branches:
      - develop

jobs:
  ci:
    name: Code Quality & Automated Tests
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: ESLint Check
        run: npm run lint

      - name: Run Vitest Test Suite (Unit & Integration)
        run: npm test

      - name: Production Bundle Build
        run: npm run build

  staging-deploy:
    name: Build Docker & Deploy Staging
    needs: [ci]
    runs-on: self-hosted
    env:
      TARGET_ENVIRONMENT: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Assert Target Environment
        run: |
          if [ "$TARGET_ENVIRONMENT" != "staging" ]; then
            echo "FATAL: Deployment target is not staging! Aborting."
            exit 1
          fi
          echo "Target environment confirmed: $TARGET_ENVIRONMENT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Staging Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: baseos/volleyscore-hub:staging-latest

      - name: Validate Staging Supabase Secrets
        run: |
          if [ -z "${{ secrets.STAGING_SUPABASE_PROJECT_ID }}" ] || [ -z "${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}" ] || [ -z "${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}" ]; then
            echo "FATAL: Required Staging Supabase secrets are missing! Aborting deploy."
            echo "Required: STAGING_SUPABASE_PROJECT_ID, STAGING_SUPABASE_ACCESS_TOKEN, STAGING_SUPABASE_DB_PASSWORD"
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push Database Migrations (Staging Only - Mandatory)
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}

      - name: Deploy Staging Container
        run: |
          docker compose -f docker-compose.staging.yml up -d --force-recreate
          sleep 5
          STATUS=$(docker inspect --format='{{json .State.Health.Status}}' baseos-staging-app | tr -d '"')
          if [ "$STATUS" != "healthy" ] && [ "$STATUS" != "starting" ]; then
            echo "FATAL: Staging container failed healthcheck! Status: $STATUS"
            docker logs baseos-staging-app
            exit 1
          fi
          echo "Staging container deployed and healthcheck confirmed."
