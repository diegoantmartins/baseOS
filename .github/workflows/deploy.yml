name: BaseOS Production Release & Deploy

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build Docker & Verify Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: baseos/volleyscore-hub:${{ github.ref_name }}
